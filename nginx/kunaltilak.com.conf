# ==============================================================================
# CloudPanel / Nginx Configuration for Production Frontend: kunaltilak.com
# Static Website with Clean URLs, Subpage Support & Gzip/Brotli Asset Caching
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.kunaltilak.com;
  return 301 https://kunaltilak.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name kunaltilak.com www1.kunaltilak.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # HTTPS Enforcement
  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html index.htm;

  # Cache static assets
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|pdf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires 30d;
    access_log off;
    try_files $uri =404;
  }

  # Clean URL routing for subpages (/education, /health, /admin, /initiatives)
  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }

  if (-f $request_filename) {
    break;
  }
}
