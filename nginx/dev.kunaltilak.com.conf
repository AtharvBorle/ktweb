# ==============================================================================
# CloudPanel / Nginx Configuration for Development Frontend: dev.kunaltilak.com
# Development Static Website with Cache-busting & Subpage Routing
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name dev.kunaltilak.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # HTTPS Enforcement
  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html index.htm;

  # Health Check & Monitoring Reverse Proxy to Dev Node.js Backend (Port 5001)
  location /health-check {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host dev.api.kunaltilak.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API Reverse Proxy to Dev Node.js Backend (Port 5001)
  location /api/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host dev.api.kunaltilak.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static media but short TTL for fast iteration during dev
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|pdf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires 1h;
    access_log off;
    try_files $uri =404;
  }

  # Clean URL routing for subpages (/education, /health, /admin, /initiatives)
  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }

  if (-f $request_filename) {
    break;
  }
}
